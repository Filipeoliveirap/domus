
name: domus-tcc

services:
  postgres:
    image: postgres:16-alpine
    container_name: domus-db-tcc
    environment:
      POSTGRES_DB: domus
      POSTGRES_USER: domus
      POSTGRES_PASSWORD: domus123
    ports:
      # 5433 no host: o 5432 fica livre para o ambiente de trabalho.
      - "5433:5432"
    volumes:
      - postgres-data-tcc:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domus -d domus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: domus-redis-tcc
    ports:
      - "6380:6379"
    volumes:
      - redis-data-tcc:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: domus-es-tcc
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
    ports:
      - "9201:9200"
    volumes:
      - elastic-data-tcc:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data-tcc:
  redis-data-tcc:
  elastic-data-tcc:
