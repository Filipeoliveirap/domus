# ─── Aplicação ─────────────────────────────────────────────────
spring.application.name=domus-api
spring.jackson.generator.write-bigdecimal-as-plain=true

# Teto de paginação: sem isso o default do Spring é 2000, permitindo ?size=2000 em qualquer listagem.
spring.data.web.pageable.max-page-size=100

# ─── Fotos ───
# O multipart do Spring recusa ANTES de ler o arquivo inteiro — é a primeira barreira.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.fotos.armazenamento=${FOTOS_ARMAZENAMENTO:r2}
app.fotos.r2.endpoint=${R2_FOTOS_ENDPOINT:}
app.fotos.r2.bucket=${R2_FOTOS_BUCKET:}
app.fotos.r2.access-key=${R2_FOTOS_ACCESS_KEY:}
app.fotos.r2.secret-key=${R2_FOTOS_SECRET_KEY:}

# Prazos de limpeza.
app.fotos.orfa-horas=${FOTOS_ORFA_HORAS:24}
app.fotos.arquivada-meses=${FOTOS_ARQUIVADA_MESES:6}

# ─── redis ────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=10s

# ─── Banco de dados ────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10

# ─── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── E-mail (transacional) ─────────────────────────────────────
email.provider=${EMAIL_PROVIDER:log}
email.remetente=${EMAIL_FROM:Domus <onboarding@resend.dev>}
resend.api-key=${RESEND_API_KEY:}

# URL base do front
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ─── Google OAuth ──────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID}

# ─── CORS ──────────────────────────────────────────────────────
# Origens permitidas (separadas por vírgula). Em prod, setar CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Sentry (rastreamento de erro) ─────────────────────────────
# DSN vazio (default) = Sentry desligado. Em prod, setar SENTRY_DSN.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:dev}
# Sem APM/performance (respeita o tier gratuito).
sentry.traces-sample-rate=0.0
# Não enviar PII automaticamente (IP, cookies, etc.) — LGPD.
sentry.send-default-pii=false

# ─── Rate limiting ─────────────────────────────────────────────
app.ratelimit.trust-forwarded-for=${RATELIMIT_TRUST_FORWARDED_FOR:false}

# ─── JWT ───────────────────────────────────────────────────────
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# ─── Logger ───────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.domus.api=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate.SQL=WARN

# ─── Servidor ──────────────────────────────────────────────────
server.port=8080

# ─── Cookies de sessão ─────────────────────────────────────────
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.path-prefix=${COOKIE_PATH_PREFIX:/api}

# ─── Proxy à frente da aplicação ───────────────────────────────
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}


