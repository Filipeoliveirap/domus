# ─── Aplicação ─────────────────────────────────────────────────
spring.application.name=domus-api
spring.jackson.generator.write-bigdecimal-as-plain=true

# ─── Fotos ───
# O multipart do Spring recusa ANTES de ler o arquivo inteiro — é a primeira barreira.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.fotos.r2.endpoint=${R2_FOTOS_ENDPOINT:}
app.fotos.r2.bucket=${R2_FOTOS_BUCKET:}
app.fotos.r2.access-key=${R2_FOTOS_ACCESS_KEY:}
app.fotos.r2.secret-key=${R2_FOTOS_SECRET_KEY:}

# Prazos de limpeza. Configuráveis porque são números que só o uso real ajusta.
app.fotos.orfa-horas=${FOTOS_ORFA_HORAS:24}
app.fotos.arquivada-meses=${FOTOS_ARQUIVADA_MESES:6}

# ─── redis ────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=10s

# ─── Banco de dados ────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool Hikari afinado para o Neon: o compute do Neon suspende quando ocioso e fecha as
# conexões. Sem isso, o pool entrega conexão morta e estoura ("connection has been closed"
# + timeout de 30s). max-lifetime recicla antes do Neon matar; keepalive-time pinga e
# descarta conexões mortas antes de entregá-las; minimum-idle=0 evita segurar ociosas.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10

# ─── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── E-mail (transacional) ─────────────────────────────────────
# provider: "log" (padrão, imprime no console) ou "resend" (envia de verdade)
email.provider=${EMAIL_PROVIDER:log}
email.remetente=${EMAIL_FROM:Domus <onboarding@resend.dev>}
resend.api-key=${RESEND_API_KEY:}

# URL base do front (para montar links em e-mails, ex.: reset de senha)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ─── Google OAuth ──────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID}

# ─── CORS ──────────────────────────────────────────────────────
# Origens permitidas (separadas por vírgula). Em prod, setar CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Sentry (rastreamento de erro) ─────────────────────────────
# DSN vazio (default) = Sentry desligado. Em prod, setar SENTRY_DSN.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:dev}
# Sem APM/performance (respeita o tier gratuito).
sentry.traces-sample-rate=0.0
# Não enviar PII automaticamente (IP, cookies, etc.) — LGPD.
sentry.send-default-pii=false

# ─── Rate limiting ─────────────────────────────────────────────
# Limites por IP, por minuto. Global = todos os endpoints; auth = rotas sensíveis.
app.ratelimit.global-por-minuto=${RATELIMIT_GLOBAL_POR_MINUTO:100}
app.ratelimit.auth-por-minuto=${RATELIMIT_AUTH_POR_MINUTO:10}
# ATENÇÃO — EM PRODUÇÃO ISTO PRECISA SER true, E COM UM PROXY REAL NA FRENTE.
# Desde que o front passou a falar com a API pelo proxy do Next (/api/*), toda requisição
# chega aqui a partir do SOCKET DO NEXT. Com false, resolverIp() cai no getRemoteAddr() e
# vê o MESMO IP para todo mundo: o limite vira um balde único do sistema inteiro (a 11ª
# pessoa a logar no mesmo minuto leva 429) e a proteção contra força bruta por IP perde o
# sentido. Verificado em 2026-07-16: o Next NÃO inventa X-Forwarded-For, mas REPASSA o que
# receber. Logo, a cadeia só fecha com um proxy real (nginx/Caddy/CDN) na frente do Next.
# E o Spring NÃO pode ficar alcançável direto, senão o header vira forjável.
app.ratelimit.trust-forwarded-for=${RATELIMIT_TRUST_FORWARDED_FOR:false}

# ─── JWT ───────────────────────────────────────────────────────
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# ─── Logger ───────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.domus.api=DEBUG
logging.level.org.springframework.security=WARN

# ─── Servidor ──────────────────────────────────────────────────
server.port=8080

# ─── Cookies de sessão ─────────────────────────────────────────
# Secure exige HTTPS; navegadores abrem exceção para localhost, então pode ficar true em dev.
app.cookie.secure=${COOKIE_SECURE:true}
# Prefixo do proxy do Next (/api/*). O Path do cookie é escrito na visão do navegador.
app.cookie.path-prefix=${COOKIE_PATH_PREFIX:/api}

# ─── Proxy à frente da aplicação ───────────────────────────────
# O Spring só vê o salto HTTP interno vindo do proxy, então request.isSecure() é sempre
# false e o HSTS nunca sairia. "framework" faz ele confiar no X-Forwarded-Proto.
# Mesma condição do trust-forwarded-for: o Next NÃO gera X-Forwarded-Proto, só repassa —
# então isto só tem efeito com um proxy real (nginx/Caddy/CDN) na frente do Next.
# Default "none": confiar nesses headers SEM proxy confiável deixa qualquer cliente forjar
# "sou HTTPS". Ligar só em produção, junto com o trust-forwarded-for.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
